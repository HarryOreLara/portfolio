<header class="site-header">
  <nav class="navbar" aria-label="Navegación principal">
    <a routerLink="/" class="brand" aria-label="Ir al inicio" (click)="closeMenu()">
      <span class="brand-mark" aria-hidden="true">HO</span>
      <span class="brand-copy">
        <strong>Harry Ore</strong>
        <small>Software Developer</small>
      </span>
    </a>

    <button type="button" class="menu-toggle" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen" aria-controls="main-menu" aria-label="Abrir menú">
      <i class="pi" [ngClass]="menuOpen ? 'pi-times' : 'pi-bars'"></i>
    </button>

    <div id="main-menu" class="nav-content" [class.is-open]="menuOpen">
      <ul class="nav-links">
        <li><a routerLink="/" [routerLinkActiveOptions]="{ exact: true }" routerLinkActive="active" (click)="closeMenu()">Inicio</a></li>
        <li><a routerLink="/projects" routerLinkActive="active" (click)="closeMenu()">Proyectos</a></li>
        <li><a routerLink="/about" routerLinkActive="active" (click)="closeMenu()">Experiencia</a></li>
        <li><a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()">Contacto</a></li>
      </ul>

      <a class="nav-cta" href="mailto:harryorelara@gmail.com">
        <span class="status-dot" aria-hidden="true"></span>
        Disponible para conversar
      </a>
    </div>
  </nav>
</header>
