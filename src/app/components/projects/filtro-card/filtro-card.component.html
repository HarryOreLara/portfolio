<section class="filter-section" aria-labelledby="filter-title">
  <div class="section-heading">
    <div>
      <p class="section-kicker">Explora por tecnología</p>
      <h2 id="filter-title">Proyectos según el stack.</h2>
      <p>Selecciona una tecnología para descubrir los casos desarrollados con ella.</p>
    </div>

    <button type="button" class="reset-button" (click)="reset()">
      <i class="pi pi-refresh" aria-hidden="true"></i>
      Restablecer
    </button>
  </div>

  <div class="technology-filter" role="group" aria-label="Filtrar proyectos por tecnología">
    <button
      type="button"
      *ngFor="let item of menuItems | filterTypeSkill"
      (click)="selectAnotherProject(item)"
      [class.active-item]="selectedItem === item.id"
      [attr.aria-pressed]="selectedItem === item.id"
    >
      <img [src]="item.imgUrl" alt="" aria-hidden="true" />
      {{ item.name }}
    </button>
  </div>

  <div class="filtered-grid" *ngIf="projects.length; else emptyProjects">
    <article class="filtered-card" *ngFor="let project of projects; let i = index">
      <button
        type="button"
        class="card-link"
        (click)="goToProject(project)"
        [attr.aria-label]="'Ver caso de estudio: ' + project.name"
      >
        <span class="project-image">
          <img [src]="project.imgUrl" [alt]="'Vista previa de ' + project.name" loading="lazy" />
          <span class="project-index">0{{ i + 1 }}</span>
        </span>
        <span class="project-content">
          <span class="project-meta">
            <span>{{ project.tecnologia.name }}</span>
            <span>{{ project.createdAt | slice:0:4 }}</span>
          </span>
          <strong>{{ project.name }}</strong>
          <span class="project-description">{{ project.description }}</span>
          <span class="project-cta">
            Ver caso de estudio <i class="pi pi-arrow-up-right" aria-hidden="true"></i>
          </span>
        </span>
      </button>
    </article>
  </div>

  <ng-template #emptyProjects>
    <div class="empty-state">
      <span><i class="pi pi-folder-open" aria-hidden="true"></i></span>
      <div>
        <h3>Aún no hay un caso publicado con esta tecnología.</h3>
        <p>Prueba seleccionando Angular o restablece el filtro para continuar explorando.</p>
      </div>
    </div>
  </ng-template>
</section>
